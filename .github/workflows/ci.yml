name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · typecheck · test · acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` currently trips EBADPLATFORM on esbuild's per-platform optional
      # deps with the committed lockfile; `npm install` honours an in-sync lockfile
      # and skips non-matching optional packages.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (ESLint, 0 warnings)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Unit + integration tests (with coverage)
        run: npm run test:coverage

      - name: Acceptance gates (G1–G4)
        run: npm run acceptance
